<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>archimeter trend</title>
<style>:root{color-scheme:light;--surface:#fcfcfb;--border:#dcdad4;--text:#0b0b0b;--text-2:#52514e;--s1:#2a78d6;--grid:#e7e5df}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--surface:#1a1a19;--border:#3a3a37;--text:#f0efec;--text-2:#c3c2b7;--s1:#3987e5;--grid:#2d2d2a}}
:root[data-theme="dark"]{color-scheme:dark;--surface:#1a1a19;--border:#3a3a37;--text:#f0efec;--text-2:#c3c2b7;--s1:#3987e5;--grid:#2d2d2a}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:20px}h2{font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}.card{border:1px solid var(--border);border-radius:8px;padding:10px}svg text{fill:var(--text-2);font:11px system-ui}svg .axis path,svg .axis line{stroke:var(--border)}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:9}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:4px 8px;border-bottom:1px solid var(--border);text-align:right}th:first-child,td:first-child{text-align:left}details{margin-top:16px}</style></head><body><main>
<h1>Trend</h1><div id="sub" style="color:var(--text-2)"></div><div class="grid" id="grid"></div>
<details><summary>Show as table</summary><div style="overflow:auto"><table id="tbl"></table></div></details></main><div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){"use strict";
const T = JSON.parse(document.getElementById("data").textContent);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("sub").textContent=(T.target.repo||T.target.name)+" · since "+T.since+" · "+T.step+" · "+T.snapshots.length+" snapshots";
const metrics=[["propagation_cost","Propagation cost (combined)",v=>(v*100).toFixed(1)+"%"],["cycles","Dependency cycles",v=>v],["hidden_coupling","Hidden couplings",v=>v],["mean_complexity","Mean cyclomatic complexity",v=>v==null?"n/a":v.toFixed(2)]];
const tip=document.getElementById("tip");
for(const [k,label,f] of metrics){
  const card=document.createElement("div");card.className="card";card.innerHTML="<h2>"+label+"</h2>";document.getElementById("grid").appendChild(card);
  const data=T.snapshots.filter(s=>s.metrics[k]!=null).map(s=>({d:new Date(s.date),v:s.metrics[k],sha:s.commit}));
  const W=420,H=200,m={l:44,r:12,t:10,b:26};const svg=d3.select(card).append("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%").attr("role","img").attr("aria-label",label);
  if(!data.length){card.insertAdjacentHTML("beforeend","<div>no data</div>");continue;}
  const x=d3.scaleTime(d3.extent(data,d=>d.d),[m.l,W-m.r]);const ext=d3.extent(data,d=>d.v);const y=d3.scaleLinear([Math.min(0,ext[0]),ext[1]===ext[0]?ext[1]+1:ext[1]*1.08],[H-m.b,m.t]);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(5));svg.append("g").attr("class","axis").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(k==="propagation_cost"?d3.format(".0%"):d3.format("~g")));
  svg.append("path").datum(data).attr("fill","none").attr("stroke","var(--s1)").attr("stroke-width",2).attr("d",d3.line().x(d=>x(d.d)).y(d=>y(d.v)));
  svg.append("g").selectAll("circle").data(data).join("circle").attr("cx",d=>x(d.d)).attr("cy",d=>y(d.v)).attr("r",4).attr("fill","var(--s1)").attr("stroke","var(--surface)").attr("stroke-width",2)
   .on("mousemove",(e,d)=>{tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";tip.innerHTML=d.d.toISOString().slice(0,10)+"<br><b>"+f(d.v)+"</b><br>"+esc(d.sha.slice(0,10));}).on("mouseleave",()=>tip.style.display="none");
}
document.getElementById("tbl").innerHTML="<thead><tr><th>Date</th><th>Commit</th>"+metrics.map(m=>"<th>"+m[1]+"</th>").join("")+"<th>LOC</th></tr></thead><tbody>"+T.snapshots.map(s=>"<tr><td>"+s.date+"</td><td>"+esc(s.commit.slice(0,10))+"</td>"+metrics.map(m=>"<td>"+(s.metrics[m[0]]==null?"n/a":m[2](s.metrics[m[0]]))+"</td>").join("")+"<td>"+s.metrics.loc+"</td></tr>").join("")+"</tbody>";
})();
</script></body></html>
